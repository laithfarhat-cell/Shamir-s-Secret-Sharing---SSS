[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shamir-sss"
version = "1.0.0"
description = "Production-grade Shamir's Secret Sharing over prime fields with AES-256-GCM file vaults"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shamir SSS contributors" }]
keywords = [
    "shamir",
    "secret-sharing",
    "threshold-cryptography",
    "finite-field",
    "lagrange-interpolation",
    "aes-gcm",
    "vault",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = ["rich>=13.7"]

[project.optional-dependencies]
vault = ["cryptography>=42.0"]
dev = ["cryptography>=42.0", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
all = ["cryptography>=42.0"]

[project.scripts]
sss = "main:main"

[project.urls]
Documentation = "https://github.com/laithfarhat-cell/Shamir-s-Secret-Sharing---SSS/blob/main/THEORY.md"
Source = "https://github.com/laithfarhat-cell/Shamir-s-Secret-Sharing---SSS"
Issues = "https://github.com/laithfarhat-cell/Shamir-s-Secret-Sharing---SSS/issues"

[tool.setuptools]
packages = ["core", "cli", "simulation"]
py-modules = ["main"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["core", "cli", "simulation"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
